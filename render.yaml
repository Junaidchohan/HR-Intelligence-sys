services:
  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: hr-talent-intelligence-backend
    runtime: python

    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: cd backend && alembic upgrade head

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: DATABASE_URL
        value: sqlite:///./talent.db

      - key: SECRET_KEY
        generateValue: true

      - key: GITHUB_OFFLINE_FIXTURES
        value: "true"

      - key: GITHUB_TOKEN
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        value: "https://hr-intelligence-sys-frontend.onrender.com"

  # ─── Frontend (Next.js — native Node.js, no Docker) ────────────────────────
  - type: web
    name: hr-intelligence-sys-frontend
    runtime: node
    rootDir: frontend

    buildCommand: npm install && npm run build
    startCommand: npm run start

    envVars:
      - key: NODE_VERSION
        value: "20"

      # Baked in at build time — Next.js NEXT_PUBLIC_ vars must be set during
      # `next build` to be available in the browser bundle.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://talentbase-ai-platform.onrender.com"

      # Also available at runtime for next.config.js rewrites (redundant but safe)
      - key: BACKEND_URL
        value: "https://talentbase-ai-platform.onrender.com"