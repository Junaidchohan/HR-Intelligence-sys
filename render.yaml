services:
  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: hr-talent-intelligence-backend
    runtime: python

    buildCommand: pip install -r backend/requirements.txt
    # FIXED: Removed "cd backend". Uses --app-dir to safely point to the app folder.
startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: DATABASE_URL
        value: sqlite:///./talent.db

      - key: SECRET_KEY
        generateValue: true

      - key: GITHUB_OFFLINE_FIXTURES
        value: "false"

      - key: GITHUB_TOKEN
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        value: "https://hr-intelligence-sys-frontend.onrender.com"

  # ─── Frontend (Next.js via Docker) ─────────────────────────────────────────
  - type: web
    name: hr-intelligence-sys-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile

    envVars:
      - key: BACKEND_URL
        value: "https://hr-talent-intelligence-backend.onrender.com"