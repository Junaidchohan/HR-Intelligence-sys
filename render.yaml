services:
  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: hr-talent-intelligence-backend
    runtime: python

    # No rootDir — CWD stays at repo root for both commands.
    # cd into backend/ so Python resolves the `app` package correctly.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: DATABASE_URL
        value: sqlite:///./talent.db

      - key: SECRET_KEY
        generateValue: true

      - key: GITHUB_OFFLINE_FIXTURES
        value: "false"

      - key: GITHUB_TOKEN
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        value: "https://hr-intelligence-sys-frontend.onrender.com"

  # ─── Frontend (Next.js via Docker) ─────────────────────────────────────────
  - type: web
    name: hr-intelligence-sys-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile

    envVars:
      # Runtime var — Next.js reads this at server startup for the rewrite proxy.
      # No build-time baking needed anymore!
      - key: BACKEND_URL
        value: "https://hr-intelligence-sys.onrender.com"
